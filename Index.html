<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Character encoding for proper text rendering -->
    <meta charset="UTF-8">

    <!-- Viewport settings for responsive design on all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO meta tags for better search engine visibility -->
    <meta name="description"
        content="Arsha - Modern business landing page template. Showcase your services, portfolio, and team with a clean, professional design.">
    <meta name="keywords" content="business landing page, corporate website, portfolio template, responsive design">
    <meta name="author" content="Martin Maina">

    <!-- Page title displayed in browser tab -->
    <title>Arsha - Better Solutions For Your Business</title>

    <!-- External stylesheet for all page styling -->
    <link rel="stylesheet" href="styles.css">

    <!-- Font Awesome for scalable vector icons -->
    <script src="https://kit.fontawesome.com/0bf4634aeb.js" crossorigin="anonymous"></script>
</head>

<body>
    <!-- Main navigation bar - sticky positioned for easy access -->
    <nav class="navbar">
        <!-- Brand logo/name -->
        <div class="logo">ARSHA</div>

        <!-- Navigation links container -->
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#portfolio">Portfolio</a>
            <a href="#team">Team</a>
            <a href="#contact">Contact</a>

            <!-- Call-to-action button in navigation -->
            <button class="btn btn-primary">Get Started</button>
        </div>
    </nav>

    <!-- Hero section - main landing area with primary message -->
    <main>
        <section class="hero-container">
            <!-- Left side: Hero content with headline and CTAs -->
            <div class="hero-content">
                <h1>Better Solutions For Your Business</h1>
                <p>We are a team of talented designers creating amazing websites with modern technologies</p>

                <!-- Action buttons for user engagement -->
                <div class="hero-buttons">
                    <button class="btn btn-secondary">Get Started</button>
                    <button class="btn btn-play">
                        <i class="fa-regular fa-circle-play"></i>
                        <span>Watch Video</span>
                    </button>
                </div>
            </div>

            <!-- Right side: Hero image/illustration -->
            <div class="hero-image">
                <img src="Images/Website.png" alt="Modern website illustration showcasing Arsha's design capabilities">
            </div>
        </section>

        <!-- Clients section - showcase trusted partners and clients -->
        <section class="clients-section">
            <div class="clients-grid">
                <!-- Client logos displayed in a responsive grid -->
                <img src="Images/myob.png" alt="MYOB - Trusted client partner">
                <img src="Images/belimo.png" alt="Belimo - Trusted client partner">
                <img src="Images/lifegroups.png" alt="LifeGroups - Trusted client partner">
                <img src="Images/lilly.png" alt="Lilly - Trusted client partner">
                <img src="Images/citrus.png" alt="Citrus - Trusted client partner">
                <img src="Images/trustly.png" alt="Trustly - Trusted client partner">
            </div>
        </section>
    </main>

    <!-- Footer section with additional information -->
    <footer class="footer">
        <p>ABOUT US</p>
    </footer>
</body>

</html>
